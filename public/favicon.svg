<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" rx="8" fill="#131008"/>

  <!-- Crossbones behind skull -->
  <line x1="8" y1="56" x2="56" y2="8" stroke="#f0e8d2" stroke-width="6" stroke-linecap="round"/>
  <line x1="56" y1="56" x2="8" y2="8" stroke="#f0e8d2" stroke-width="6" stroke-linecap="round"/>
  <!-- Bone end knobs -->
  <circle cx="8"  cy="8"  r="5" fill="#f0e8d2"/>
  <circle cx="56" cy="8"  r="5" fill="#f0e8d2"/>
  <circle cx="8"  cy="56" r="5" fill="#f0e8d2"/>
  <circle cx="56" cy="56" r="5" fill="#f0e8d2"/>

  <!-- Skull dome -->
  <ellipse cx="32" cy="28" rx="16" ry="15" fill="#f0e8d2"/>
  <!-- Jaw -->
  <rect x="22" y="37" width="20" height="9" rx="3" fill="#f0e8d2"/>

  <!-- Eyes -->
  <ellipse cx="26" cy="27" rx="4.5" ry="5" fill="#131008"/>
  <ellipse cx="38" cy="27" rx="4.5" ry="5" fill="#131008"/>

  <!-- Nose -->
  <path d="M30 33 L32 36 L34 33 Z" fill="#131008"/>

  <!-- Teeth gaps -->
  <line x1="27" y1="37" x2="27" y2="46" stroke="#131008" stroke-width="2"/>
  <line x1="32" y1="37" x2="32" y2="46" stroke="#131008" stroke-width="2"/>
  <line x1="37" y1="37" x2="37" y2="46" stroke="#131008" stroke-width="2"/>

  <!-- Red bandana strip across skull -->
  <rect x="16" y="22" width="32" height="5" rx="2" fill="#c02020"/>
</svg>
