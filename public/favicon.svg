<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a1628"/>
  <!-- Outer rim -->
  <circle cx="32" cy="32" r="24" stroke="#c9a24a" stroke-width="3" fill="none"/>
  <!-- Inner hub -->
  <circle cx="32" cy="32" r="6" fill="#c9a24a"/>
  <circle cx="32" cy="32" r="3" fill="#0a1628"/>
  <!-- Spokes (8 spokes) -->
  <line x1="32" y1="26" x2="32" y2="10" stroke="#c9a24a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="32" y2="54" stroke="#c9a24a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="32" x2="10" y2="32" stroke="#c9a24a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="32" x2="54" y2="32" stroke="#c9a24a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="27.7" y1="27.7" x2="15.5" y2="15.5" stroke="#c9a24a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36.3" y1="36.3" x2="48.5" y2="48.5" stroke="#c9a24a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36.3" y1="27.7" x2="48.5" y2="15.5" stroke="#c9a24a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="27.7" y1="36.3" x2="15.5" y2="48.5" stroke="#c9a24a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Handle knobs at end of each spoke on the rim -->
  <circle cx="32" cy="10" r="2.5" fill="#c9a24a"/>
  <circle cx="32" cy="54" r="2.5" fill="#c9a24a"/>
  <circle cx="10" cy="32" r="2.5" fill="#c9a24a"/>
  <circle cx="54" cy="32" r="2.5" fill="#c9a24a"/>
  <circle cx="15.5" cy="15.5" r="2.5" fill="#c9a24a"/>
  <circle cx="48.5" cy="48.5" r="2.5" fill="#c9a24a"/>
  <circle cx="48.5" cy="15.5" r="2.5" fill="#c9a24a"/>
  <circle cx="15.5" cy="48.5" r="2.5" fill="#c9a24a"/>
</svg>
